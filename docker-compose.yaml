services:
  postgres:
    image: postgres:16
    container_name: postgres_latest
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PWD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis
    container_name: redis
    ports: 
      - 6379:6379
  app:
    build: .
    container_name: e-commerce_app
    restart: unless-stopped
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    ports: 
      - 8000:8000
    env_file: 
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
volumes:
  postgres_data: